# Deploy the PWA to GitHub Pages.
#
# Push the contents of this directory as the repo root. On every push to
# main (or manual dispatch) it installs, builds, and publishes dist/ to
# Pages. PAGES_BASE is derived from the repo name automatically, so the app
# works under https://<owner>.github.io/<repo>/ with zero config.
# (Exception: a <owner>.github.io repo is served from /, so unset PAGES_BASE
# there — see the README.)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # prebuild fetches the Tesseract OCR assets (engine + traineddata)
      # into public/ so they ship with the site and get precached.
      - run: npm ci
      - run: npm run build
        env:
          PAGES_BASE: '/${{ github.event.repository.name }}/'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
